<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Màn hình nhập mật khẩu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center min-vh-100 h-100">

  <div class="container-sm">
    <div class="row g-0 shadow-lg rounded overflow-hidden min-vh-75">

      <!-- Cột ảnh -->
      <div class="col-12 col-md-6 d-flex align-items-center justify-content-center bg-dark p-3">
        <img src="./images/album-5.jpg" class="img-fluid w-75 rounded" alt="Ảnh minh họa">
      </div>

      <!-- Cột nhập mật khẩu -->
      <div class="col-12 col-md-6 bg-white p-4 d-flex flex-column align-items-center justify-content-center">
        <h5 class="mb-3 text-center">Nhập mật khẩu</h5>
        <div class="input-group" style="width: 60%;">
          <input type="text" readonly class="form-control text-center mb-3" maxlength="6" id="passwordText" placeholder="" aria-describedby="">
          <div class="input-group-prepend">
            <div class="input-group-text btn btn-outline-info" data-bs-toggle="tooltip" data-bs-trigger="click" disable id="btnGroupAddon" data-toggle="tooltip" data-placement="top" title="Ngày mình yêu nhau">?</div>
          </div>

        </div>
        <div class="container px-0">
          <div class="row row-cols-3 g-2">
            <div class="col"><button class="btn btn-outline-primary w-100 py-2" id="1"
                onclick="btnNumber(this.id)">1</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2" id="2"
                onclick="btnNumber(this.id)">2</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2" id="3"
                onclick="btnNumber(this.id)">3</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2" id="4"
                onclick="btnNumber(this.id)">4</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2" id="5"
                onclick="btnNumber(this.id)">5</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2" id="6"
                onclick="btnNumber(this.id)">6</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2" id="7"
                onclick="btnNumber(this.id)">7</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2" id="8"
                onclick="btnNumber(this.id)">8</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2" id="9"
                onclick="btnNumber(this.id)">9</button></div>
            <div class="col"><button class="btn btn-outline-danger w-100 py-2" id="Xóa"
                onclick="btnNumber(this.id)">Xóa</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2" id="0"
                onclick="btnNumber(this.id)">0</button></div>
            <div class="col"><button class="btn btn-success w-100 py-2" id="OK" onclick="btnNumber(this.id)">OK</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
  <script src="./login.js" defer></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>

</html>
