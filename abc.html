<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Màn hình nhập mật khẩu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 h-100">

  <div class="container-sm">
    <div class="row g-0 shadow-lg rounded overflow-hidden min-vh-75">
      
      <!-- Cột ảnh -->
      <div class="col-12 col-md-6 d-flex align-items-center justify-content-center bg-dark p-3">
        <img src="https://picsum.photos/300/300" class="img-fluid w-75 rounded" alt="Ảnh minh họa">
      </div>

      <!-- Cột nhập mật khẩu -->
      <div class="col-12 col-md-6 bg-white p-4 d-flex flex-column align-items-center justify-content-center">
        <h5 class="mb-3 text-center">Nhập mật khẩu</h5>
        <input type="password" class="form-control text-center mb-3" placeholder="••••" style="max-width: 120px;">
        
        <div class="container px-0">
          <div class="row row-cols-3 g-2">
            <div class="col"><button class="btn btn-outline-primary w-100 py-2">1</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2">2</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2">3</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2">4</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2">5</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2">6</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2">7</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2">8</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2">9</button></div>
            <div class="col"><button class="btn btn-outline-danger w-100 py-2">Xóa</button></div>
            <div class="col"><button class="btn btn-outline-primary w-100 py-2">0</button></div>
            <div class="col"><button class="btn btn-success w-100 py-2">OK</button></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
