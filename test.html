<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm ngày yêu</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .counter-card {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            position: relative;
        }
        .counter-card:hover {
            transform: scale(1.05);
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff3c78;
            margin-bottom: 20px;
        }

        .days {
            font-size: 6rem;
            font-weight: bold;
            color: #ff6b81;
            display: inline-block;
            position: relative;
        }

        .heart {
            color: #ff4757;
            font-size: 3rem;
            margin-left: 10px;
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }

        .petal {
            position: absolute;
            width: 15px;
            height: 15px;
            background: pink;
            border-radius: 50%;
            opacity: 0.8;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-200px) rotate(180deg); opacity: 0.4; }
            100% { transform: translateY(-400px) rotate(360deg); opacity: 0; }
        }

        #startDateText {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #ff6b81;
        }
    </style>
</head>
<body>
    <div class="counter-card">
        <h1>Ngày yêu của chúng ta</h1>
        <div class="text-center days" id="daysCount">0</div>
        <span class="heart">❤️</span>
        <p id="startDateText"></p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Thay đổi ngày bắt đầu yêu theo định dạng YYYY-MM-DD
        const startDate = new Date("2024-03-01T00:00:00"); 
        const startDateText = document.getElementById('startDateText');
        startDateText.textContent = `Bắt đầu từ: ${startDate.toLocaleDateString()}`;

        function updateDays() {
            const now = new Date();
            const diffTime = now - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('daysCount').textContent = diffDays;
        }

        updateDays();
        setInterval(updateDays, 1000);

        // Tạo hoa bay
        const counterCard = document.querySelector('.counter-card');
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDuration = (4 + Math.random() * 4) + 's';
            counterCard.appendChild(petal);
            setTimeout(() => petal.remove(), 6000);
        }

        setInterval(createPetal, 300);
    </script>
</body>
</html>
