<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kỷ niệm của chúng ta ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1 id="hero-title">Kỷ niệm của chúng ta</h1>
      <p class="subtitle">Những khoảnh khắc đã qua &amp; những chương sắp tới...</p>
      <div class="hero-actions">
        <button id="open-timeline">Xem timeline</button>
        <button id="open-gallery">Xem album ảnh</button>
        <button id="surprise-btn">Nhấn để bất ngờ ❤️</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section id="timeline-section" class="section">
      <h2>Timeline</h2>
      <p class="hint">Chỉnh nội dung dễ dàng trong <code>script.js</code> → mảng <code>TIMELINE</code>.</p>
      <div id="timeline" class="timeline" aria-live="polite"></div>
    </section>

    <section id="gallery-section" class="section">
      <h2>Album ảnh</h2>
      <p class="hint">Thêm/bỏ ảnh trong thư mục <code>images/</code> và cập nhật mảng <code>GALLERY</code>.</p>
      <div id="gallery" class="gallery"></div>
    </section>

    <section id="ending" class="section ending">
      <h2>Kết</h2>
      <p>Mình sẽ còn viết tiếp câu chuyện cùng em ❤️</p>
      <button id="top-btn">Về đầu trang</button>
    </section>
  </main>

  <!-- Modal / lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="Đóng">✕</button>
    <button class="lb-prev" aria-label="Trước">‹</button>
    <img class="lb-img" src="" alt="">
    <button class="lb-next" aria-label="Tiếp">›</button>
  </div>

  <!-- Optional background music -->
  <!-- Nếu muốn bật nhạc: đặt file music.mp3 vào cùng thư mục và bật src -->
  <audio id="bg-music" src="music.mp3" preload="none"></audio>
  <div class="music-controls">
    <button id="music-toggle">Bật nhạc</button>
    <label>Âm lượng <input id="music-vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  </div>

  <!-- Hearts canvas (pointer-events none so clicks work) -->
  <canvas id="hearts-canvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
