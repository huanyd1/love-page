<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Kỷ Niệm Yêu</title>
<style>
  :root {
    --bg-color: #fff;
    --text-color: #000;
    --accent-color: #ff6b81;
  }
  body {
    margin:0;
    font-family: Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    transition: 0.3s;
  }
  body.dark {
    --bg-color: #121212;
    --text-color: #f0f0f0;
  }
  /* Login */
  #login {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh; background:#f9f9f9;
  }
  #login input { padding:10px; font-size:16px; margin-bottom:10px; }
  #login button { padding:10px 20px; font-size:16px; cursor:pointer; }

  /* Main Content */
  #mainContent { display:none; padding:20px; max-width:800px; margin:auto; }
  .section { margin-bottom:40px; }
  h2 { color: var(--accent-color); }

  /* Timeline */
  .timeline { border-left:2px solid var(--accent-color); padding-left:20px; }
  .event { margin-bottom:20px; }

  /* Album */
  .album { display:grid; grid-template-columns: repeat(auto-fill,minmax(100px,1fr)); gap:10px; }
  .album img { width:100%; border-radius:10px; }

  /* Mini game */
  #game { display:flex; flex-direction:column; align-items:center; }
  #game button { padding:10px 20px; font-size:16px; cursor:pointer; margin-top:10px; }

  /* Dark mode toggle */
  #darkModeBtn { position:fixed; top:10px; right:10px; padding:10px; cursor:pointer; }
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <h1>Nhập mật khẩu để vào web</h1>
  <input type="password" id="pass" placeholder="Mật khẩu">
  <button onclick="checkPassword()">Vào Web</button>
</div>

<!-- Main Content -->
<div id="mainContent">

  <!-- Dark mode button -->
  <button id="darkModeBtn" onclick="toggleDarkMode()">Dark Mode</button>

  <!-- 1. Đếm ngày yêu -->
  <div class="section">
    <h2>Đếm ngày yêu</h2>
    <p id="loveDays"></p>
  </div>

  <!-- 2. Nhắc nhở kỷ niệm -->
  <div class="section">
    <h2>Nhắc nhở kỷ niệm</h2>
    <ul id="reminders"></ul>
  </div>

  <!-- 3. Album ảnh -->
  <div class="section">
    <h2>Album ảnh</h2>
    <div class="album">
      <img src="https://via.placeholder.com/150" alt="Ảnh 1">
      <img src="https://via.placeholder.com/150" alt="Ảnh 2">
      <img src="https://via.placeholder.com/150" alt="Ảnh 3">
    </div>
  </div>

  <!-- 4. Dòng thời gian -->
  <div class="section">
    <h2>Dòng thời gian kỷ niệm</h2>
    <div class="timeline" id="timeline"></div>
  </div>

  <!-- 5. Mini game -->
  <div class="section">
    <h2>Mini Game: Click Tim</h2>
    <div id="game">
      <p>Điểm: <span id="score">0</span></p>
      <button onclick="addPoint()">Click Tim ❤️</button>
    </div>
  </div>

</div>

<!-- Nhạc nền -->
<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
  // --- Password ---
  const correctPassword = "love123";
  function checkPassword() {
    const pass = document.getElementById('pass').value;
    if(pass === correctPassword) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
    } else alert("Sai mật khẩu!");
  }

  // --- Đếm ngày yêu ---
  const startDate = new Date("2024-01-01");
  function updateDays() {
    const now = new Date();
    const diffTime = now - startDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    document.getElementById('loveDays').innerText = `Đã yêu nhau ${diffDays} ngày`;
  }
  updateDays();
  setInterval(updateDays, 1000 * 60 * 60);

  // --- Nhắc nhở kỷ niệm ---
  const events = [
    { date: "2025-09-25", name: "Ngày đầu gặp nhau" },
    { date: "2025-10-20", name: "Sinh nhật người yêu" }
  ];
  const remindersEl = document.getElementById('reminders');
  events.forEach(e => {
    const li = document.createElement('li');
    li.innerText = `${e.date} - ${e.name}`;
    remindersEl.appendChild(li);
  });

  // --- Timeline ---
  const timelineEl = document.getElementById('timeline');
  events.forEach(e => {
    const div = document.createElement('div');
    div.classList.add('event');
    div.innerText = `${e.date}: ${e.name}`;
    timelineEl.appendChild(div);
  });

  // --- Mini game ---
  let score = 0;
  function addPoint() {
    score++;
    document.getElementById('score').innerText = score;
  }

  // --- Dark mode ---
  function toggleDarkMode() {
    document.body.classList.toggle('dark');
  }
</script>
</body>
</html>
