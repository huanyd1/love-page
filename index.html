<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kỷ niệm tình yêu 💕</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Màn hình đăng nhập -->

  <div id="login">
  <div class="login-left"></div>
  <div class="login-right">
    <h2>Nhập mật khẩu 💖</h2>
    <input type="password" id="passInput" readonly>
    <div id="numpad"></div>
  </div>

 <!--Nội dung chính -->
  <div id="main" style="display:none;">
    <section id="counter" class="glass-box">
      <h2>Đếm ngày yêu 💞</h2>
      <p><span id="daysTogether"></span></p>
    </section>

    <section id="reminder" class="glass-box">
      <h2>Nhắc nhở kỷ niệm 📅</h2>
      <p id="nextEvent"></p>
    </section>

    <section id="album" class="glass-box">
      <h2>Album ảnh 📸</h2>
      <div id="slidesContainer"></div>
      <button onclick="prevSlide()">⏪</button>
      <button onclick="nextSlide()">⏩</button>
    </section>

    <section id="timeline" class="glass-box">
      <h2>Dòng thời gian kỷ niệm 🕒</h2>
      <div id="timeline"></div>
    </section>

    <section id="game" class="glass-box">
      <h2>Mini Game 🎮</h2>
      <button onclick="clickLove()">Click tim ❤️</button>
      <p>Điểm: <span id="score">0</span></p>
      <p id="gameMsg"></p>
      <div id="puzzleContainer"></div>
    </section>

    <section class="glass-box">
      <button onclick="toggleDarkMode()">🌙 Bật/Tắt Dark Mode</button>
    </section>

    <audio id="bgMusic" autoplay loop>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
